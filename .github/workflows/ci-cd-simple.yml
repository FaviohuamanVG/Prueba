name: 🚀 CI/CD Simple - Tests & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🏗️ Build, Test & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build & Test
        run: mvn clean test -B

      - name: 📊 Generate Coverage
        run: mvn jacoco:report -B

      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 30

      - name: 📊 Test Summary
        if: always()
        run: |
          echo "🧪 Tests completed!"
          echo "📊 Check artifacts for detailed reports"
