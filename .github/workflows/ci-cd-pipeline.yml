name: 🚀 CI/CD Pipeline - Catalog Microservice

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: BUILD, TEST & QUALITY ANALYSIS
  # ============================================
  build-test-analyze:
    name: 🏗️ Build, Test & Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      # ========== CHECKOUT ==========
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis completo de SonarQube

      # ========== SETUP JAVA ==========
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ========== BUILD PROJECT ==========
      - name: 🔨 Build Project
        run: mvn clean compile -B

      # ========== RUN TESTS ==========
      - name: 🧪 Run Tests (Including Parameterized Tests)
        run: mvn test -B
        continue-on-error: false

      # ========== GENERATE JACOCO REPORT ==========
      - name: 📊 Generate JaCoCo Coverage Report
        run: mvn jacoco:report -B

      # ========== VERIFY JACOCO REPORT ==========
      - name: ✅ Verify JaCoCo Report Generation
        run: |
          if [ -f "target/site/jacoco/jacoco.xml" ]; then
            echo "✅ JaCoCo report generated successfully"
            echo "📊 Coverage report location: target/site/jacoco/jacoco.xml"
          else
            echo "❌ JaCoCo report not found"
            exit 1
          fi

      # ========== UPLOAD JACOCO REPORT ==========
      - name: 📤 Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 30

      # ========== UPLOAD TEST RESULTS ==========
      - name: 📋 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/test-classes/
          retention-days: 30

      # ========== SONARQUBE ANALYSIS ==========
      - name: 🔍 SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=com.techtrend:catalog-microservice \
            -Dsonar.projectName="Catalog Microservice" \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.exclusions=**/*Application.java \
            -Dsonar.test.exclusions=**/*Test.java
        continue-on-error: true  # No falla el pipeline si SonarQube no está disponible

      # ========== GENERATE COVERAGE BADGE ==========
      - name: 🏅 Generate Coverage Badge
        if: github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(grep -oP '<counter type="LINE".*?missed="(\d+)".*?covered="(\d+)"' target/site/jacoco/jacoco.xml | head -1 | grep -oP 'missed="\K\d+|covered="\K\d+' | paste -sd+ | bc | awk '{print ($1/($1+$2))*100}')
          echo "📊 Test Coverage: ${COVERAGE}%"
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV

      # ========== PACKAGE APPLICATION ==========
      - name: 📦 Package Application
        run: mvn package -DskipTests -B

      # ========== UPLOAD JAR ARTIFACT ==========
      - name: 📤 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-microservice-jar
          path: target/*.jar
          retention-days: 30

      # ========== DISPLAY TEST SUMMARY ==========
      - name: 📊 Display Test Summary
        if: always()
        run: |
          echo "================================"
          echo "📊 TEST EXECUTION SUMMARY"
          echo "================================"
          
          if [ -d "target/surefire-reports" ]; then
            TOTAL_TESTS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | grep -oP 'tests="\K\d+' | awk '{s+=$1} END {print s}')
            FAILURES=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | grep -oP 'failures="\K\d+' | awk '{s+=$1} END {print s}')
            ERRORS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "errors=" {} \; | grep -oP 'errors="\K\d+' | awk '{s+=$1} END {print s}')
            SKIPPED=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | grep -oP 'skipped="\K\d+' | awk '{s+=$1} END {print s}')
            
            echo "✅ Total Tests: ${TOTAL_TESTS:-0}"
            echo "❌ Failures: ${FAILURES:-0}"
            echo "⚠️  Errors: ${ERRORS:-0}"
            echo "⏭️  Skipped: ${SKIPPED:-0}"
            echo "================================"
            
            if [ "${FAILURES:-0}" -eq 0 ] && [ "${ERRORS:-0}" -eq 0 ]; then
              echo "🎉 All tests passed successfully!"
            else
              echo "⚠️  Some tests failed. Please review the logs."
            fi
          else
            echo "⚠️  No test reports found"
          fi

      # ========== COMMENT PR WITH RESULTS ==========
      - name: 💬 Comment PR with Test Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 Test Results\n\n';
            comment += '### ✅ Pipeline Status: Success\n\n';
            comment += '| Metric | Value |\n';
            comment += '|--------|-------|\n';
            comment += '| 🧪 Tests | Passed |\n';
            comment += '| 📊 JaCoCo Report | Generated |\n';
            comment += '| 🔍 SonarQube | Analyzed |\n';
            comment += '| 📦 Build | Success |\n\n';
            comment += '📋 [View full test results in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # JOB 2: DOCKER BUILD (Optional)
  # ============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build-test-analyze
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build -t catalog-microservice:latest .
          echo "✅ Docker image built successfully"
        continue-on-error: true  # Opcional si no tienes Dockerfile

      - name: 📊 Display Docker Image Info
        run: |
          if docker images catalog-microservice:latest --format "{{.Repository}}:{{.Tag}}" | grep -q catalog-microservice; then
            echo "✅ Docker image created successfully"
            docker images catalog-microservice:latest
          else
            echo "ℹ️  Docker image creation skipped (Dockerfile not found)"
          fi
        continue-on-error: true

  # ============================================
  # JOB 3: NOTIFICATION (Optional)
  # ============================================
  notification:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [build-test-analyze, docker-build]
    if: always()
    
    steps:
      - name: 📊 Pipeline Status
        run: |
          echo "================================"
          echo "🚀 CI/CD PIPELINE COMPLETED"
          echo "================================"
          echo "📊 Build Status: ${{ needs.build-test-analyze.result }}"
          echo "🐳 Docker Status: ${{ needs.docker-build.result }}"
          echo "================================"
          
          if [ "${{ needs.build-test-analyze.result }}" == "success" ]; then
            echo "✅ Pipeline completed successfully!"
          else
            echo "❌ Pipeline failed. Please check the logs."
          fi
