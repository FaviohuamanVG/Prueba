# Configuración del proyecto SonarQube
# =====================================

# Información básica del proyecto
sonar.projectKey=com.techtrend:catalog-microservice
sonar.projectName=Catalog Microservice - TechTrend
sonar.projectVersion=0.0.1-SNAPSHOT
sonar.projectDescription=Microservicio de catálogo de productos para TechTrend

# Configuración del servidor SonarQube
sonar.host.url=http://localhost:9000
sonar.login=admin
sonar.password=admin

# Configuración de archivos fuente
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Configuración de cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco
sonar.dynamicAnalysis=reuseReports

# Configuración del lenguaje
sonar.java.source=17
sonar.java.target=17

# Exclusiones de análisis
sonar.exclusions=**/*Application.java,**/target/**
sonar.test.exclusions=**/*Test.java,**/target/**

# Configuración de encoding
sonar.sourceEncoding=UTF-8

# Configuración adicional para Spring Boot
sonar.java.libraries=target/dependency/*.jar

# Métricas y umbrales de calidad
sonar.qualitygate.wait=true

# Configuración para análisis incremental
sonar.scm.provider=git